<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <style>
    body { font-family: Inter, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: rgb(252,251,248); }
    .box { text-align: center; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Conectando sua loja...<br>Aguarde um momento.</p>
  </div>
  <script>
    // Pega todos os parâmetros da URL atual (vindos do marketplace)
    const params = window.location.search;
    const hash = window.location.hash;
    const path = window.location.pathname; // ex: /dashboard/marketplaces/callback/shopee

    // Redireciona para o sistema local mantendo todos os parâmetros
    const localUrl = 'http://localhost:3000' + path + params + hash;
    window.location.replace(localUrl);
  </script>
</body>
</html>
